<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLV Communications | Shop Management</title>
<style>
:root{--blue:#1a73e8;--blue-dark:#1558b0;--green:#137333;--red:#c5221f;--orange:#f9ab00;--bg:#f0f2f5;--ink:#202124;--muted:#5f6368;--line:#e2e8f0}
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:var(--bg);margin:0;padding:16px;color:var(--ink);min-height:100vh}
.app{width:100%;max-width:760px;margin:0 auto}
.main-header{background:var(--blue);color:#fff;padding:15px;text-align:center;border-radius:10px 10px 0 0}
.header-title{font-size:19px;font-weight:800;letter-spacing:.4px}
.sub-title{font-size:12px;opacity:.95;margin-top:4px}
.card{background:#fff;border-radius:0 0 12px 12px;box-shadow:0 4px 15px rgba(0,0,0,.09);padding:18px;margin-bottom:14px}
h2,h3,h4{margin:0 0 12px}
h3{font-size:17px}
h4{font-size:14px}
label{display:block;font-size:12px;font-weight:700;margin:8px 0 4px}
input,select,textarea{width:100%;padding:11px;margin:4px 0 9px;border:1px solid #c9cdd2;border-radius:7px;font-size:14px;background:#fff}
textarea{min-height:70px;resize:vertical}
button,.link-button{border:0;border-radius:7px;padding:11px 13px;font-size:13px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;margin:4px 3px 4px 0}
button:hover{filter:brightness(.95)}
.btn-secondary{background:#5f6368}.btn-green{background:var(--green)}.btn-red{background:var(--red)}.btn-orange{background:var(--orange);color:#222}
.btn-small{padding:6px 9px;font-size:11px}
.section-box,.slab-box{background:#f8f9fa;border:1px solid var(--line);padding:12px;border-radius:8px;margin:10px 0}
.section-box h4{margin-bottom:8px}
.banner{display:none;background:#fce8e6;border:2px solid var(--red);color:var(--red);padding:11px;border-radius:8px;font-weight:bold;text-align:center;margin-bottom:12px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
.tile{background:#e8f0fe;border:1px solid #d2e3fc;color:#0b57d0;border-radius:8px;padding:14px;text-align:center;font-weight:700;cursor:pointer}
.tile span{display:block;font-size:23px;margin-bottom:5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1;min-width:100px}
.emp-row,.leave-row,.tx-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #eee;font-size:12px}
.emp-row>div:first-child,.leave-row>div:first-child,.tx-row>div:first-child{flex:1}
.muted{color:var(--muted);font-size:12px}
.total{background:#e8f0fe;color:#0b57d0;padding:13px;border-radius:8px;text-align:center;font-size:18px;font-weight:800;margin:12px 0}
.hidden{display:none!important}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.topbar strong{font-size:13px}
hr{border:0;border-top:1px solid #eee;margin:14px 0}
#cartContainer .slab-box{position:relative}
.remove-row{float:right;background:var(--red);padding:4px 8px;font-size:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:8px;border-bottom:1px solid #eee}
@media(max-width:480px){body{padding:8px}.card{padding:13px}.header-title{font-size:16px}.emp-row{align-items:flex-start}}

/* ===== SLV PREMIUM WEBSITE THEME ===== */
:root{
 --blue:#2457d6;--blue-dark:#173b9b;--green:#168653;--red:#d94343;
 --orange:#f4a623;--bg:#f4f6fb;--ink:#172033;--muted:#697386;--line:#e7ebf3;
 --surface:#fff;--shadow:0 14px 38px rgba(25,42,85,.09)
}
body{
 font-family:Inter,"Segoe UI",Arial,sans-serif;
 background:radial-gradient(circle at 8% 0%,#e7edff 0,transparent 32%),linear-gradient(135deg,#f6f8fc,#eef2f9);
 padding:28px 18px;color:var(--ink)
}
.app{max-width:1080px}
.main-header{
 position:relative;overflow:hidden;text-align:left;padding:25px 30px;
 border-radius:18px 18px 0 0;
 background:linear-gradient(115deg,#142c68 0%,#2457d6 58%,#4e82f5 100%);
 box-shadow:0 12px 28px rgba(36,87,214,.2)
}
.main-header:before,.main-header:after{
 content:"";position:absolute;border-radius:50%;pointer-events:none;
 background:rgba(255,255,255,.09)
}
.main-header:before{width:230px;height:230px;right:8%;top:-150px}
.main-header:after{width:140px;height:140px;right:-35px;bottom:-90px}
.header-title{font-size:24px;letter-spacing:1.2px;position:relative;z-index:1}
.sub-title{font-size:13px;margin-top:7px;position:relative;z-index:1;letter-spacing:.2px}
.card{
 border-radius:0 0 18px 18px;padding:26px 30px;margin-bottom:20px;
 box-shadow:var(--shadow);border:1px solid rgba(230,235,245,.9);border-top:0
}
#loginView{max-width:540px;margin-left:auto;margin-right:auto;padding:32px}
#loginView h3{font-size:23px;text-align:left!important;margin-bottom:22px}
#loginView h3:after{content:"";display:block;width:48px;height:4px;background:var(--blue);border-radius:8px;margin-top:12px}
h3{font-size:19px;color:#182744;letter-spacing:-.2px}
h4{font-size:15px;color:#243452}
label{font-size:12px;color:#394760;margin-top:12px}
input,select,textarea{
 border:1px solid #dce2ed;border-radius:9px;padding:12px 13px;
 background:#fbfcff;color:#172033;transition:border-color .18s,box-shadow .18s
}
input:focus,select:focus,textarea:focus{
 outline:none;border-color:#6b91f0;box-shadow:0 0 0 3px rgba(36,87,214,.12);background:#fff
}
button{
 border-radius:9px;padding:11px 16px;font-size:12px;letter-spacing:.15px;
 box-shadow:0 3px 8px rgba(25,42,85,.08);transition:transform .15s,filter .15s,box-shadow .15s
}
button:hover{filter:brightness(1.04);transform:translateY(-1px);box-shadow:0 6px 13px rgba(25,42,85,.13)}
button:active{transform:translateY(0)}
.btn-secondary{background:#647084}.btn-green{background:#168653}.btn-red{background:#d94343}
.btn-orange{background:#f4b544;color:#352400}
.section-box{
 background:linear-gradient(145deg,#fff,#f9fbff);border:1px solid #e7ebf3;
 border-radius:13px;padding:18px;margin:14px 0;box-shadow:0 4px 13px rgba(30,50,90,.035)
}
.section-box[style*="border-left"]{border-left-width:4px!important}
.slab-box{background:#f8faff;border:1px solid #e8edf6;border-radius:10px;padding:14px}
.banner{border-radius:11px}
.grid{gap:13px}
.tile{
 background:linear-gradient(145deg,#f0f5ff,#e5edff);border:1px solid #d9e4ff;
 color:#214ba9;border-radius:13px;padding:20px 12px;min-height:95px;
 box-shadow:0 5px 14px rgba(36,87,214,.06);transition:.18s
}
.tile:hover{transform:translateY(-3px);box-shadow:0 10px 20px rgba(36,87,214,.12)}
.tile span{font-size:27px}
.total{
 background:linear-gradient(110deg,#eaf1ff,#f1f5ff);border:1px solid #dce7ff;
 color:#1e4eb7;border-radius:12px;padding:16px
}
.topbar{padding-bottom:13px;border-bottom:1px solid #edf0f6;margin-bottom:17px}
.topbar strong{font-size:16px;color:#1b2c4b}
.emp-row,.leave-row,.tx-row{padding:12px 3px;font-size:13px}
.muted{color:#758096;line-height:1.55}
hr{border-top:1px solid #e9edf4}
#adminView,#employeeView,#servicesView{min-height:350px}
#adminView>.section-box:first-of-type{margin-top:5px}
#employeeView .slab-box{padding:16px}
#drawerCash{font-size:25px}
footer{font-size:11px;letter-spacing:.2px}
@media(max-width:600px){
 body{padding:10px 8px}
 .app{max-width:100%}
 .main-header{padding:20px 18px;border-radius:14px 14px 0 0}
 .header-title{font-size:19px}
 .card{padding:17px 14px;border-radius:0 0 14px 14px}
 #loginView{padding:22px 17px}
 #loginView h3{font-size:20px}
 .row{gap:5px}
 .row>*{min-width:calc(50% - 5px)}
 .topbar{align-items:center}
 button{padding:10px 12px}
}


/* ===== PROFESSIONAL DASHBOARD LAYOUT ===== */
.app{max-width:1180px}
.main-header{
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  padding:24px 32px;border-radius:20px 20px 0 0
}
.main-header:after{right:5%;bottom:-100px}
.header-title{font-size:25px;font-weight:850}
.sub-title{max-width:420px}
.main-header:after{
  content:"LOCAL BUSINESS PORTAL";position:absolute;right:30px;top:50%;
  transform:translateY(-50%);font-size:10px;letter-spacing:1.5px;font-weight:800;
  color:rgba(255,255,255,.78);background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2);border-radius:30px;padding:9px 14px
}
.card{padding:30px 32px;border-radius:0 0 20px 20px}
#loginView{
  max-width:560px;margin:34px auto;padding:38px;
  border-radius:20px;border:1px solid #e5eaf4
}
#loginView h3{font-size:25px}
#adminView{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:20px;align-items:start
}
#adminView.hidden{display:none!important}
#adminView>.topbar,#adminView>button:last-child{grid-column:1/-1}
#adminView>.topbar{margin:0 0 2px;padding:0 0 16px}
#adminView>.section-box{
  margin:0;height:100%;padding:21px;background:#fff;
  border:1px solid #e5eaf3;border-radius:16px;
  box-shadow:0 7px 22px rgba(28,45,85,.045)
}
#adminView>.section-box:nth-of-type(2){background:linear-gradient(145deg,#fff,#f7f9ff)}
#adminView>.section-box:nth-of-type(3){background:linear-gradient(145deg,#fff,#fffcf4)}
#adminView>.section-box:nth-of-type(4){background:linear-gradient(145deg,#fff,#f4fbf7)}
#adminView>.section-box:nth-of-type(5),
#adminView>.section-box:nth-of-type(6),
#adminView>.section-box:nth-of-type(7){grid-column:1/-1}
#adminView>.section-box h4{
  display:flex;align-items:center;gap:8px;font-size:16px;
  padding-bottom:13px;border-bottom:1px solid #edf0f6;margin-bottom:14px
}
#adminView>.section-box .muted{font-size:12px}
#adminView>.section-box input,#adminView>.section-box select{margin-bottom:7px}
#employeeView{padding:28px 32px}
#employeeView .slab-box{
  display:inline-block;vertical-align:top;width:calc(50% - 8px);
  min-height:92px;margin:8px 8px 10px 0;border-radius:15px;
  border:1px solid #e6ebf4;padding:18px
}
#employeeView .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
#employeeView .tile{min-height:112px}
#employeeView>h3{margin-top:24px!important;padding-bottom:10px;border-bottom:1px solid #edf0f6}
#employeeView>input{max-width:560px}
#employeeView>.section-box{margin-top:22px}
#servicesView{padding:28px 32px}
#servicesView .slab-box{background:#fff;border:1px solid #e5eaf3;border-radius:14px;padding:18px;margin:14px 0}
#servicesView .total{font-size:21px;padding:20px}
#servicesView>button.btn-orange{margin-top:12px}
#cartContainer{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
#cartContainer .slab-box{margin:0;min-width:0}
#cartContainer input,#cartContainer select{min-width:0}
.emp-row,.leave-row,.tx-row{gap:14px}
table{background:#fff;border-radius:10px;overflow:hidden}
th{background:#f3f6fc;color:#344363;font-weight:800}
footer{padding:18px!important}
@media(max-width:760px){
  body{padding:8px}
  .main-header{display:block;padding:20px 18px}
  .main-header:after{display:none}
  .header-title{font-size:20px}
  .card{padding:18px 14px}
  #adminView{grid-template-columns:1fr;gap:13px}
  #adminView>.section-box,#adminView>.section-box:nth-of-type(n){grid-column:1}
  #adminView>.topbar,#adminView>button:last-child{grid-column:1}
  #adminView>.section-box{padding:16px}
  #employeeView .slab-box{width:100%;margin:7px 0;min-height:unset}
  #employeeView .grid{grid-template-columns:1fr}
  #cartContainer{grid-template-columns:1fr}
  #loginView{margin:18px auto;padding:24px 18px}
  #servicesView{padding:18px 14px}
}


/* ===== CREATIVE WORKSPACE / CANVA-INSPIRED VISUAL REFRESH ===== */
:root{
  --blue:#6254d9;--blue-dark:#4537b7;--green:#159b78;--orange:#f29b38;
  --bg:#f7f6ff;--ink:#20213a;--muted:#777891;--line:#ecebfa;
}
body{
  background:
    radial-gradient(ellipse at 8% 5%,rgba(255,190,215,.45),transparent 28%),
    radial-gradient(ellipse at 92% 8%,rgba(172,207,255,.55),transparent 30%),
    linear-gradient(145deg,#faf8ff 0%,#f2f6ff 48%,#fff8f3 100%);
  color:var(--ink);padding:30px 20px;
}
.app{max-width:1240px}
.main-header{
  min-height:132px;padding:30px 38px;border-radius:25px 25px 0 0;
  background:linear-gradient(115deg,#4338a8 0%,#6658dc 48%,#8d6be8 100%);
  box-shadow:0 18px 45px rgba(83,72,190,.22);
}
.main-header:before{width:310px;height:310px;right:13%;top:-205px;background:rgba(255,255,255,.11)}
.main-header:after{
  width:180px;height:180px;right:3%;bottom:-120px;
  background:rgba(255,255,255,.12);content:"";
}
.header-title{font-size:27px;letter-spacing:1.1px;font-weight:900}
.sub-title{font-size:13px;opacity:.88}
.card{
  background:rgba(255,255,255,.96);border:1px solid rgba(231,229,250,.95);
  border-radius:0 0 25px 25px;padding:34px 38px;
  box-shadow:0 18px 55px rgba(52,54,110,.09);
}
h3{color:#28264f;font-size:21px}
h4{color:#393568;font-size:15px}
#loginView{
  max-width:570px;margin:42px auto;border-radius:25px;
  border:1px solid #e9e6fb;padding:38px;
  box-shadow:0 22px 60px rgba(72,64,155,.12);
  background:linear-gradient(150deg,#fff 0%,#fcfbff 65%,#f3f1ff 100%);
}
#loginView h3{font-size:25px}
#loginView h3:after{width:64px;height:5px;background:linear-gradient(90deg,#6254d9,#f08bb5)}
input,select,textarea{
  border:1px solid #e3e2f2;border-radius:12px;background:#fcfbff;
  padding:13px 14px;color:#292744;
}
input:focus,select:focus,textarea:focus{
  border-color:#8c80ed;box-shadow:0 0 0 4px rgba(98,84,217,.12)
}
button{
  border-radius:12px;padding:12px 17px;
  background:linear-gradient(110deg,#6254d9,#7868e8);
  box-shadow:0 7px 16px rgba(98,84,217,.17);
}
button:hover{box-shadow:0 10px 22px rgba(98,84,217,.23)}
.btn-green{background:linear-gradient(110deg,#159b78,#27b58c)}
.btn-orange{background:linear-gradient(110deg,#f2a13d,#f6bd63);color:#432b0b}
.btn-red{background:linear-gradient(110deg,#dc5b70,#ee7d8d)}
.btn-secondary{background:linear-gradient(110deg,#68718c,#8992ad)}
.section-box{
  position:relative;overflow:hidden;background:#fff;
  border:1px solid #ecebfa;border-radius:19px;padding:22px;
  box-shadow:0 9px 26px rgba(55,53,112,.055);
}
.section-box:before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,#7b6ce8,#e69ac3);opacity:.85
}
.section-box h4{font-size:16px;margin-bottom:14px}
.slab-box{
  border:1px solid #eae8f7;border-radius:15px;
  background:linear-gradient(135deg,#fff,#faf9ff);padding:17px;
}
#adminView{
  grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;
}
#adminView>.section-box:nth-of-type(2){background:linear-gradient(140deg,#fff,#f5f3ff)}
#adminView>.section-box:nth-of-type(3){background:linear-gradient(140deg,#fff,#fff6f8)}
#adminView>.section-box:nth-of-type(4){background:linear-gradient(140deg,#fff,#f0fbf7)}
#adminView>.section-box:nth-of-type(5){background:linear-gradient(140deg,#fff,#f4f8ff)}
#adminView>.section-box:nth-of-type(6){background:linear-gradient(140deg,#fff,#fff9ef)}
#adminView>.section-box:nth-of-type(7){background:linear-gradient(140deg,#fff,#f8f5ff)}
.tile{
  min-height:120px;border-radius:18px;border:1px solid #e5e1fb;
  background:linear-gradient(145deg,#f2efff,#e9eaff);
  color:#4c43a8;box-shadow:0 9px 22px rgba(92,80,190,.09);
}
.tile:nth-child(3n+2){background:linear-gradient(145deg,#fff0f5,#ffe8ef);color:#a84e79}
.tile:nth-child(3n){background:linear-gradient(145deg,#eafaf5,#dcf5ec);color:#17775e}
.tile span{font-size:30px}
.total{
  color:#4b40b0;background:linear-gradient(110deg,#f0edff,#e9f1ff);
  border:1px solid #e3defe;border-radius:16px;padding:19px;
}
.topbar{padding-bottom:16px;border-bottom:1px solid #efedfa}
.topbar strong{font-size:17px;color:#302c64}
.emp-row,.leave-row,.tx-row{border-bottom:1px solid #f0eff8;padding:14px 5px}
.banner{border-radius:14px}
table{border:1px solid #ecebfa;border-radius:13px;overflow:hidden}
th{background:#f1efff;color:#4a438d}
footer{padding:20px!important;color:#8988a3}
@media(max-width:760px){
 body{padding:10px 8px}
 .main-header{min-height:unset;padding:23px 19px;border-radius:18px 18px 0 0}
 .header-title{font-size:21px}
 .card{padding:20px 15px;border-radius:0 0 18px 18px}
 #adminView{grid-template-columns:1fr;gap:14px}
 #adminView>.section-box,#adminView>.section-box:nth-of-type(n){grid-column:1}
 #adminView>.section-box{padding:17px}
 #loginView{margin:20px auto;padding:25px 19px;border-radius:19px}
 .tile{min-height:100px}
}


/* Monthly target wallet */
.target-wallet-section{grid-column:1/-1!important;background:linear-gradient(135deg,#fff 0%,#f7f4ff 55%,#f1f7ff 100%)!important}
.target-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin:18px 0}
.target-metric{padding:17px;border:1px solid #e8e4fb;border-radius:15px;background:rgba(255,255,255,.85);display:flex;flex-direction:column;gap:8px}
.target-metric span{font-size:12px;color:#77758f;font-weight:700}
.target-metric strong{font-size:21px;color:#4d42b5}
.target-progress-track{height:14px;background:#e7e4f6;border-radius:20px;overflow:hidden}
.target-progress-bar{height:100%;width:0;background:linear-gradient(90deg,#6555dc,#29b58b);border-radius:20px;transition:width .3s ease}
.target-progress-label{display:flex;justify-content:space-between;gap:12px;margin-top:9px;font-size:12px;color:#696782}
.daily-profit-history{margin-top:18px;padding-top:14px;border-top:1px solid #e9e6f7}
.daily-profit-row{display:flex;justify-content:space-between;padding:9px 4px;border-bottom:1px solid #eeedf6;font-size:13px}
.daily-profit-row b{color:#188366}
@media(max-width:760px){.target-metrics{grid-template-columns:1fr}.target-wallet-section{grid-column:1!important}}


#profitSlabFields textarea{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;line-height:1.65}
#profitSlabFields{padding:12px;margin:8px 0 14px;border:1px dashed #c9c2f4;border-radius:13px;background:#faf9ff}


/* Editable service rule controls */
#servicesAdminList .emp-row{display:flex;align-items:center;flex-wrap:wrap}
#servicesAdminList .emp-row button{flex:0 0 auto}


/* Employee hamburger navigation and per-employee wallet access */
.employee-topbar{display:flex;align-items:center;gap:14px}
.employee-topbar strong{flex:1}
.hamburger-btn{width:46px;height:42px;padding:0;font-size:23px;border-radius:12px}
.employee-side-menu{position:fixed;z-index:1002;left:0;top:0;bottom:0;width:min(320px,84vw);padding:20px;background:#fff;box-shadow:18px 0 50px rgba(28,25,75,.2);transform:translateX(-110%);transition:transform .25s ease;display:flex;flex-direction:column;gap:9px}
.employee-side-menu.open{transform:translateX(0)}
.menu-shade{position:fixed;inset:0;background:rgba(21,20,45,.38);z-index:1001;opacity:0;pointer-events:none;transition:opacity .2s}
.menu-shade.open{opacity:1;pointer-events:auto}
.side-menu-head{display:flex;justify-content:space-between;align-items:center;padding:8px 0 20px;border-bottom:1px solid #ecebfa;color:#4439a4}
.side-menu-head button{width:36px;padding:7px}
.side-menu-link{width:100%;text-align:left;background:#f5f3ff;color:#39336f;box-shadow:none}
.side-menu-caption{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#8a87a7;font-weight:800;margin:18px 4px 3px}
.assigned-wallet-list{display:flex;flex-direction:column;gap:8px}
.assigned-wallet-item{display:flex;justify-content:space-between;gap:8px;padding:10px 11px;border:1px solid #eae8f7;border-radius:11px;font-size:13px}
.assigned-wallet-item b{color:#168364}
.side-logout{margin-top:auto;background:#fff0f2;color:#b84458}
.employee-wallet-assignment{min-width:210px;display:flex;flex-direction:column;gap:6px}
.employee-wallet-assignment label{font-size:12px;font-weight:700;color:#625f7d}
.employee-wallet-assignment select{min-width:210px;max-width:260px;padding:7px;height:auto}
